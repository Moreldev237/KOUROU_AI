upstream kourou_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # --- Fichiers statiques (admin Django, etc.) --------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # --- Tuteur IA : réponse en streaming (Server-Sent Events) ------------
    # Nginx met en tampon les réponses par défaut, ce qui casserait le
    # streaming "au fil du texte" : on désactive explicitement le buffering
    # sur cette route et on augmente le délai de lecture (la connexion reste
    # ouverte pendant toute la génération).
    location /api/ai/tutor/chat/ {
        proxy_pass http://kourou_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 120s;
    }

    # --- Webhook CinetPay : IP variables, pas d'auth, on journalise -------
    location /api/payments/webhook/ {
        proxy_pass http://kourou_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API + admin Django (reste des routes) -----------------------------
    location / {
        proxy_pass http://kourou_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
