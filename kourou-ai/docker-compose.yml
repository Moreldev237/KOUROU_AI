x-backend-env: &backend-env
  env_file:
    - ./backend/.env
  # Le fichier .env (partagé avec l'usage en local, hors Docker) peut contenir
  # POSTGRES_HOST=localhost / REDIS_URL=redis://localhost:6379/... : à
  # l'intérieur du réseau Docker Compose, ces services s'appellent "db" et
  # "redis", pas "localhost". On surcharge donc explicitement ces variables
  # réseau ici ; le reste (SECRET_KEY, GEMINI_API_KEY, CINETPAY_*, etc.)
  # continue de venir du .env.
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    DJANGO_SETTINGS_MODULE: config.settings.production
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kourou_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: ["web"]
    restart: unless-stopped
    <<: *backend-env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  celery_worker:
    build: ./backend
    command: ["worker"]
    restart: unless-stopped
    <<: *backend-env

  celery_beat:
    build: ./backend
    command: ["beat"]
    restart: unless-stopped
    <<: *backend-env

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Décommenter une fois le certificat SSL en place (voir docs/DEPLOYMENT.md) :
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      # - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
